<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bubba Beep Beep">
<meta name="theme-color" content="#F6F7F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111411" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bubba Beep Beep</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone app. A fixed header band, a scrolling body, and a sticky action bar. Work/rest/prep are semantic phase colors; the accent is the single green. */
:root{
  --bg:#F6F7F4; --surface:#FFFFFF; --surface-2:#EEF0EB; --fg:#161916; --muted:#6A6F68; --line:#E1E4DE;
  --accent:#1E7A5C; --accent-fg:#FFFFFF;
  --work:#1E7A5C; --work-soft:#DCEFE6; --rest:#2F63C4; --rest-soft:#DCE6F8; --prep:#C4841A; --prep-soft:#F8EBD3; --round:#6E55B8; --round-soft:#E8E2F6;
  --danger:#B8402F;
  --font-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-num:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(20,30,20,.05),0 8px 24px rgba(20,30,20,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111411; --surface:#1A1E1A; --surface-2:#232823; --fg:#ECEFE9; --muted:#9AA197; --line:#2B302B;
  --accent:#3FBE8F; --accent-fg:#0E1A14;
  --work:#3FBE8F; --work-soft:#1A332A; --rest:#6E9BEE; --rest-soft:#1B2740; --prep:#E3A440; --prep-soft:#3A2D14; --round:#A48FE6; --round-soft:#2A2340;
  --danger:#E26A58; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111411; --surface:#1A1E1A; --surface-2:#232823; --fg:#ECEFE9; --muted:#9AA197; --line:#2B302B;
  --accent:#3FBE8F; --accent-fg:#0E1A14;
  --work:#3FBE8F; --work-soft:#1A332A; --rest:#6E9BEE; --rest-soft:#1B2740; --prep:#E3A440; --prep-soft:#3A2D14; --round:#A48FE6; --round-soft:#2A2340;
  --danger:#E26A58; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark }

html,body{height:100%}
/* No double-tap zoom (taps on the timer controls are often quick doubles); pinch-zoom still works. */
html{touch-action:manipulation}
/* The page itself never scrolls (only inner panes do), so a pull-down can't trigger pull-to-refresh or rubber-banding. */
html,body{overflow:hidden;overscroll-behavior:none}
.scroll,.sheet .panel{overscroll-behavior-y:contain}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:inherit}
/* iOS Safari zooms into any field under 16px on focus, so every field stays at 16px or more. */
input,select,textarea{font-size:max(16px,1em)}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"cv01" 1}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:10px;min-height:52px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar h1{font-size:18px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.text-btn{color:var(--accent);font-weight:600;padding:8px 4px}
.scroll{flex:1;min-height:0;overflow-y:auto;padding-block:4px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.scroll>*{flex-shrink:0}
.actionbar{padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:var(--bg);display:flex;gap:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:14px 20px;font-weight:600;font-size:15px;background:var(--surface-2);color:var(--fg);flex:1;min-width:0;transition:transform .08s ease}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.section{display:flex;flex-direction:column;gap:10px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.section-head h2{font-size:15px;font-weight:600}

/* Home */
.quick-card{display:flex;align-items:center;gap:14px;padding:16px;text-align:left;width:100%}
.quick-card .glyph{width:44px;height:44px;border-radius:12px;background:var(--work-soft);color:var(--work);display:grid;place-items:center;flex:none}
.quick-card .glyph svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.quick-card b{display:block;font-weight:600}
.quick-card small{color:var(--muted)}
.preset-list{display:flex;flex-direction:column;overflow:hidden}
.preset{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left;border-top:1px solid var(--line)}
.preset:first-child{border-top:0}
.preset:hover{background:var(--surface-2)}
.preset .dot{width:10px;height:10px;border-radius:50%;flex:none}
.preset .meta{flex:1;min-width:0}
.preset .meta b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preset .meta small{color:var(--muted)}
.preset .dur{color:var(--muted);font-size:14px;flex:none}
.preset .chev{color:var(--muted);flex:none}
.preset .chev svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.welcome{padding-top:24px}
.welcome-hero{display:flex;flex-direction:column;gap:10px}
.welcome-hero img{border-radius:18px}
.welcome-hero h1{font-size:24px;font-weight:600;line-height:1.2}
.welcome-hero p{margin:0;color:var(--muted)}
.welcome .eq-set .chip{font-size:15px;padding:10px 14px}
.see-more{align-self:center;color:var(--accent);font-weight:600;padding:10px 16px;margin-top:-4px}
.empty{padding:20px 16px;color:var(--muted);text-align:center;font-size:14px}
.hist{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.hist:first-child{border-top:0}
.hist .meta{flex:1;min-width:0}
.hist .meta b{font-weight:600}
.hist .meta small{display:block;color:var(--muted)}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:12px 14px}
.stat .eyebrow{margin-bottom:4px}
.stat .v{font-size:20px;font-weight:600}

/* Form rows */
.rows{display:flex;flex-direction:column;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;border-top:1px solid var(--line);min-height:56px}
.row:first-child{border-top:0}
.row .lbl{flex:1;min-width:0}
.row .lbl b{display:block;font-weight:500;line-height:1.3;overflow-wrap:break-word}
.row .lbl small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:2px;overflow-wrap:break-word;hyphens:auto}
/* Steppers share one width per screen so they line up, and never take more than 60% of a row. */
.stepper{display:flex;align-items:center;gap:2px;flex:none;width:clamp(112px,40%,148px);max-width:60%;background:var(--surface-2);border-radius:999px;padding:3px}
.stepper button{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:var(--fg)}
.stepper button:hover{background:var(--surface)}
.stepper .val{flex:1;width:0;min-width:0;text-align:center;font-weight:600;font-size:16px;background:transparent;border:0;padding:0}
@media (max-width:340px){.row{gap:10px;padding:10px 10px 10px 14px}.stepper button{width:28px;height:28px;font-size:16px}}
.phase-swatch{width:4px;align-self:stretch;border-radius:2px;flex:none;margin-left:-4px}
.text-field{width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:11px 12px;font-size:16px}
.text-field:focus{border-color:var(--accent);outline:0;background:var(--surface)}
.chip-set{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* Builder exercises */
.ex{display:flex;flex-direction:column;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex-head{display:flex;align-items:center;gap:10px}
.ex-head .idx{width:26px;height:26px;border-radius:50%;background:var(--work-soft);color:var(--work);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.ex-head .text-field{flex:1;min-width:0}
.ex-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{background:var(--surface-2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mini .eyebrow{font-size:10.5px}
.mini .ctrl{display:flex;align-items:center;justify-content:space-between;gap:4px}
.mini .ctrl button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:16px}
.mini .ctrl button:hover{background:var(--surface)}
.mini .ctrl .val{font-weight:600;font-size:16px;text-align:center;background:transparent;border:0;width:100%;min-width:0;padding:0}
.ex-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ex-foot small{color:var(--muted)}
.ex-foot .tools{display:flex;gap:2px}
.add-ex{padding:14px 16px;width:100%;text-align:center;color:var(--accent);font-weight:600;border-top:1px dashed var(--line)}

/* Timeline */
.timeline{display:flex;flex-direction:column;gap:8px;padding:14px 16px}
.tl-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:1px;background:var(--surface-2)}
.tl-bar span{display:block;min-width:1px}
.tl-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted)}
.tl-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}
.tl-total{display:flex;justify-content:space-between;align-items:baseline}
.tl-total .t{font-size:22px;font-weight:600}

/* Running */
.run{flex:1;min-height:0;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 12px;gap:14px}
.run-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.run-top .total{text-align:right}
.run-top .total b{display:block;font-size:15px;font-weight:600}
.run-top .total small{color:var(--muted);font-size:12px}
.phase-pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;background:var(--phase-soft);color:var(--phase)}
.phase-pill i{width:8px;height:8px;border-radius:50%;background:var(--phase)}
.ring-wrap{flex:1;min-height:0;display:grid;place-items:center}
.ring{position:relative;height:min(78vw,340px,100%);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--surface-2)}
.ring .prog{stroke:var(--phase);transition:stroke-dashoffset .12s linear}
@media (prefers-reduced-motion: reduce){.ring .prog{transition:none}.btn{transition:none}}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12%}
.ring .time{font-size:clamp(56px,20vw,88px);font-weight:500;line-height:1;letter-spacing:-.02em}
.ring .name{font-size:clamp(17px,4.6vw,21px);font-weight:600;margin-top:10px;max-width:100%;overflow-wrap:anywhere}
.ring .sub{color:var(--muted);font-size:14px;margin-top:4px}
.next{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:14px;min-height:22px}
.next[hidden]{display:none}
.wt{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:8px 10px 8px 14px;flex:none}
.wt[hidden]{display:none}
.wt-l{flex:1;min-width:0;display:flex;flex-direction:column}
.wt-l b{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt-b{width:36px;height:36px;border-radius:50%;background:var(--surface-2);font-size:18px;flex:none}
#wt-in{width:64px;text-align:center;font-size:18px;font-weight:600;border:0;border-radius:10px;background:var(--surface-2);padding:7px 4px}
.wt-u{color:var(--muted);font-size:13px}
.wt-sum{display:flex;align-items:center;gap:6px}
.wt-sum input{width:76px;text-align:center;padding:8px 6px}
.hist .wts{display:block;color:var(--accent);font-size:12px;margin-top:2px}
.prog-chart{position:relative;margin:4px 0 12px}
.prog-chart svg{width:100%;height:auto;display:block}
.prog-chart .grid{stroke:var(--line);stroke-width:1}
.prog-chart .axis{fill:var(--muted);font-size:11px;font-family:var(--font-num)}
.prog-chart .line{fill:none;stroke:var(--work);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.prog-chart .dot{fill:var(--work);stroke:var(--surface);stroke-width:2}
.prog-chart .hit{fill:transparent;cursor:pointer}
.prog-tip{position:absolute;transform:translate(-50%,calc(-100% - 12px));background:var(--fg);color:var(--bg);border-radius:10px;padding:6px 10px;font-size:12px;white-space:nowrap;pointer-events:none;display:flex;flex-direction:column;align-items:center}
.prog-tip.below{transform:translate(-50%,12px)}
.prog-tip[hidden]{display:none}
.prog-tip b{font-size:14px}
.prog-stat{text-align:center;padding:16px 0}
.prog-stat .big{font-size:36px;font-weight:600}
.prog-stat p{color:var(--muted);margin:4px 0 0;font-size:14px}
.run-extra{display:flex;justify-content:center;gap:8px;min-height:36px;flex:none}
.run-extra .chip{font-size:14px;padding:8px 16px;font-weight:600}
.run-extra [hidden]{display:none}
.tut{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:8px 14px 8px 8px;flex:none}
.tut[hidden]{display:none}
.focus{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:8px 14px 8px 8px;flex:none}
.focus[hidden]{display:none}
.focus-map{width:140px;flex:none}
.body{width:100%;height:auto;display:block}
.body .mbase>*{fill:var(--surface-2)}
.body .mn>*{fill:var(--line)}
.body .mp>*{fill:var(--phase)}
.body .ms>*{fill:var(--phase);opacity:.4}
.body .mlabel{fill:var(--muted);font-size:9px}
.focus-c{margin-top:2px;min-height:2.7em}
.focus-c b{color:var(--fg);font-weight:600}
.focus-src{font-size:10.5px;opacity:.8}
.tut svg{width:140px;height:116px;flex:none}
.fig .lim{stroke:var(--fg);stroke-width:4.5;stroke-linecap:round}
.fig .far{opacity:.35}
.fig .head{fill:var(--fg)}
.fig .db{fill:var(--phase,var(--accent))}
.fig .gnd{stroke:var(--line);stroke-width:2;stroke-linecap:round}
/* Exercise library: name dropdown, builder thumbnails, browse sheet */
.ex-head{position:relative}
.ex-fig{flex:none;width:46px;height:40px;display:grid;place-items:center;background:var(--surface-2);border-radius:10px}
.ex-fig svg{width:40px;height:34px}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:300px;overflow-y:auto;overscroll-behavior:contain;padding:4px}
.sug{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:8px;text-align:left;font-size:15px}
.sug:hover,.sug:focus-visible{background:var(--surface-2)}
.sug svg{width:40px;height:34px;flex:none}
.sug small{margin-left:auto;color:var(--muted);font-size:12px;flex:none}
.sug-h{padding:10px 8px 4px}
.add-row{display:flex;border-top:1px dashed var(--line)}
.add-row .add-ex{flex:1;border-top:0}
.add-row .add-ex+.add-ex{border-left:1px dashed var(--line)}
.panel.lib{max-height:88vh;display:flex;flex-direction:column;gap:10px}
.lib-head{display:flex;align-items:center;justify-content:space-between}
.lib-parts{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:none;padding-bottom:2px}
.lib-parts::-webkit-scrollbar{display:none}
.lib-parts .chip{flex:none}
.lib-parts .chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.lib-list{overflow-y:auto;min-height:0;flex:1;overscroll-behavior:contain}
.lib-list .sug-h{padding:12px 0 2px}
.lib-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.lib-row svg{width:64px;height:54px;flex:none;background:var(--surface-2);border-radius:10px;padding:4px}
.lib-n{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lib-n b{font-weight:600}
.eq-tag{font-size:11.5px;font-weight:600;color:var(--accent)}
.lib-hidden{padding:8px 0}
.eq-set .chip{font-size:13.5px}
.lib-n small{color:var(--muted);font-size:12.5px;line-height:1.35}
.tut-t{min-width:0;display:flex;flex-direction:column;gap:2px}
.tut-t b{font-weight:600;font-size:16px;line-height:1.25;overflow-wrap:break-word}
.tut-t small{color:var(--muted);font-size:13px;line-height:1.35}
.next b{color:var(--fg);font-weight:600}
.controls{display:flex;align-items:center;justify-content:center;gap:16px}
.ctl{width:54px;height:54px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--fg)}
.ctl.big{width:76px;height:76px;background:var(--fg);color:var(--bg)}
.ctl svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ctl.big svg{width:30px;height:30px}
.ctl svg.fill{fill:currentColor;stroke:none}
.run-foot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
.run-foot button{color:var(--danger);font-weight:600}
.progress-dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.progress-dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.progress-dots i.done{background:var(--phase)}

/* Summary */
.summary-hero{text-align:center;padding:24px 16px 8px}
.summary-hero .big{font-size:48px;font-weight:600;letter-spacing:-.02em}
.summary-hero p{margin:4px 0 0;color:var(--muted)}
.sum-list{display:flex;flex-direction:column}
.sum-list .row{min-height:48px}
.sum-list .row .lbl b{font-weight:500}
.sum-list .row .v{color:var(--muted)}

/* Settings sheet */
.sheet{position:fixed;inset:0;background:rgba(10,14,10,.35);display:grid;grid-template-columns:minmax(0,1fr);place-items:end center;z-index:20}
.sheet .panel{width:100%;max-width:520px;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding-block:12px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.sheet .panel>:not(.lib-list){flex-shrink:0}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.toggle{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.toggle[aria-checked="true"]{background:var(--accent)}
.toggle[aria-checked="true"]::after{transform:translateX(18px)}
.note{font-size:12.5px;color:var(--muted);padding:0 4px}
.greet{margin:0;color:var(--muted);font-size:14px}
.hearts{position:fixed;inset:0;pointer-events:none;z-index:15}
.toast.update{cursor:pointer;z-index:40}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:30;box-shadow:var(--shadow)}

// ---------- compile workout -> flat sequence ----------
function compile(w){
  const seq=[];
  if(w.prep>0) seq.push({kind:'prep',label:'Get ready',dur:w.prep});
  const exs=w.exercises.filter(e=>e.dur>0);
  for(let r=1;r<=w.rounds;r++){
    exs.forEach((e,i)=>{
      const lastEx=i===exs.length-1;
      for(let s=1;s<=e.sets;s++){
        seq.push({kind:'work',label:(!e.name||e.name==='Work')?'Workout':e.name,dur:e.dur,set:s,sets:e.sets,reps:e.reps,round:r,rounds:w.rounds,exIdx:i});
        const lastSet=s===e.sets;
        const finalInterval=lastSet&&lastEx&&r===w.rounds;
        if(finalInterval) break;
        if(!lastSet&&e.restBetweenSets>0) seq.push({kind:'rest',label:'Rest',dur:e.restBetweenSets,round:r,rounds:w.rounds});
        else if(lastSet&&!lastEx&&w.restBetweenExercises>0) seq.push({kind:'rest',label:'Rest',dur:w.restBetweenExercises,round:r,rounds:w.rounds});
      }
    });
    if(r<w.rounds&&w.restBetweenRounds>0) seq.push({kind:'round',label:'Round break',dur:w.restBetweenRounds,round:r,rounds:w.rounds});
  }
  for(let i=0;i<seq.length;i++){const n=seq.slice(i+1).find(x=>x.kind==='work');seq[i].next=n?n:null}
  return seq;
}

function setSession(){try{if(navigator.audioSession)navigator.audioSession.type=settings.loud?'playback':'ambient'}catch(e){}}

// Cute cartoon "beep beep": two quick chirps that bend up in pitch, softened with a triangle wave.
function chirp(freq,dur,when=0,vol=.22){const c=ac();if(!c||!settings.sound)return;const t=c.currentTime+when,o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.setValueAtTime(freq*.85,t);o.frequency.exponentialRampToValueAtTime(freq*1.12,t+dur*.6);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.setValueAtTime(vol,t+dur*.55);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.02)}

let beepBuf=null;
function loadBeep(){const c=ac();if(!c||beepBuf)return;try{const bin=atob(BEEP_WAV),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);c.decodeAudioData(u.buffer,b=>{beepBuf=b},()=>{})}catch(e){}}
function beepAt(sec,when){const R=S.run,c=ac();if(!settings.sound)return;
  // If audio is blocked (no context, or iOS hasn't resumed it), say the beep instead so the countdown is never silent.
  if(!c||c.state!=='running'){setTimeout(()=>say('beep',true,{pitch:1.6,rate:1.2}),Math.max(0,when*1000-150));return}
  if(!beepBuf){chirp(1175,.09,when);return}
  const src=c.createBufferSource(),g=c.createGain();src.buffer=beepBuf;src.playbackRate.value=1.08;g.gain.value=.9;src.connect(g).connect(c.destination);src.start(c.currentTime+when);
  if(R){R.pend=(R.pend||[]).filter(x=>x.t>c.currentTime);R.pend.push({src,at:c.currentTime+when,t:c.currentTime+when+.4})}}

const vib=p=>{try{if(settings.sound&&navigator.vibrate)navigator.vibrate(p)}catch(e){}};
const beepWork=()=>{tone(1047,.16);tone(1319,.22,.17);vib([60,40,60])};
const beepRest=()=>{tone(660,.35);vib(200)};

// Favour natural-sounding, warm female voices (cuter than the default male ones); push novelty and robotic voices to the bottom.
function scoreVoice(v){const n=v.name.toLowerCase();let s=0;if(/natural|neural|premium|enhanced|siri/.test(n))s+=50;if(/\b(samantha|ava|allison|zoe|karen|moira|tessa|serena|aria|jenny|libby|sonia|emma|michelle|nicky|kathy|victoria|susan|fiona|catherine|zira|hazel|clara|natasha|female)\b/.test(n))s+=40;if(/\b(daniel|alex|fred|tom|aaron|arthur|gordon|oliver|rishi|lee|evan|nathan|guy|davis|mark|david|george|ryan|william|male)\b/.test(n))s-=40;if(/google/.test(n))s+=10;if(/compact|eloquence|zarvox|whisper|bells|cellos|trinoids|albert|junior|bahh|boing|bubbles|deranged|hysterical|organ|ralph|good news|bad news|\b(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley)\b/.test(n))s-=60;if(v.default)s+=5;return s}

// ---------- running engine ----------
let wake=null;
async function lockScreen(){try{if('wakeLock' in navigator)wake=await navigator.wakeLock.request('screen')}catch(e){}}
function unlockScreen(){try{wake&&wake.release();wake=null}catch(e){}}

function startRun(w){
  {const p=presets.find(x=>x.id===w.id);if(p){p.lastUsed=Date.now();store.set('cadence.presets',presets)}}
  const seq=compile(w);if(!seq.length)return;
  S.run={w,seq,idx:0,endAt:0,remain:0,paused:false,startedAt:Date.now(),pausedMs:0,pausedAt:0,weights:{},nextBeep:3,pend:[],timer:null,color:w.color||'work'};
  ac();loadBeep();
  S.screen='run';
  beginInterval(0,true);
  lockScreen();
  S.run.timer=setInterval(tick,50);
  render();
}
function beginInterval(i,first){
  const R=S.run;R.idx=i;const it=R.seq[i];R.endAt=Date.now()+it.dur*1000;R.remain=it.dur*1000;
  // Countdown beeps step down 3, 2, 1, once each per interval.
  cancelBeeps();R.nextBeep=3;R.cheered=false;R.tipped=false;if(document.hidden)runNotify();
  if(it.kind==='work'){beepWork();const parts=[it.label+'.'];if(it.reps)parts.push(/^\d+$/.test(it.reps)?`${spokenNum(+it.reps)} reps.`:`${it.reps}.`);if(it.sets>1)parts.push(`Set ${spokenNum(it.set)} of ${spokenNum(it.sets)}.`);if(!it.next)parts.push(pick([`Last one, ${settings.nick}. Make it count.`,`Final interval. You're incredible.`]));else if(Math.random()<0.3)parts.push(pick([`Go ${settings.nick}, go.`,`You've got this.`,`Looking strong.`,`Beep beep.`]));say(parts.join(' '))}
  else if(it.kind==='prep'){if(!first)beepRest();say(`${aww()}, let's get ready!`,false,SWEET)}
  else{beepRest();const nx=it.next&&it.dur>=8?` Next up, ${it.next.label}.`:'';say((it.kind==='round'?pick([`Round ${spokenNum(it.round)} done. ${settings.nick}, you're a machine.`,`That's round ${spokenNum(it.round)}. Breathe. Drink water. Flex a little.`]):pick(['Rest.',`Rest, ${settings.nick}.`,'Breathe.','Shake it out.']))+nx)}
}
function tick(){
  const R=S.run;if(!R||R.paused)return;
  const now=Date.now();R.remain=R.endAt-now;
  const sec=Math.ceil(R.remain/1000);
  // A quarter of the way into a work set of 30s+, read one form tip (cycling by set number).
  {const it=R.seq[R.idx];if(it.kind==='work'&&it.dur>=30&&!R.tipped&&R.remain<=it.dur*750&&R.remain>it.dur*500+3000){R.tipped=true;const t=tipsFor(it.label).tips;if(t.length)say(t[((it.set||1)-1)%t.length])}}
  // Halfway through a work set of 20s or more, a word of encouragement (not too close to the countdown).
  {const it=R.seq[R.idx];if(it.kind==='work'&&it.dur>=20&&!R.cheered&&R.remain<=it.dur*500&&R.remain>5000){R.cheered=true;say(cheer(),false,SWEET)}}
  // Schedule each countdown beep a moment ahead, at the exact offset of its second boundary; skip any already passed (e.g. after resuming).
  if(settings.countdown&&R.seq[R.idx].dur>3){while(R.nextBeep>=1&&R.remain-R.nextBeep*1000<-40)R.nextBeep--;
    const b=R.nextBeep,ahead=R.remain-b*1000;if(b>=1&&ahead<=250){beepAt(b,Math.max(0,ahead)/1000);R.nextBeep=b-1}}
  if(R.remain<=0){
    // Carry overshoot so drift doesn't accumulate. After time in the background, intervals that fully elapsed are
    // skipped silently so only the current one is announced.
    let over=-R.remain,i=R.idx+1;
    while(i<R.seq.length&&over>=R.seq[i].dur*1000){over-=R.seq[i].dur*1000;i++}
    if(i>=R.seq.length){finishRun(true);return}
    beginInterval(i);R.endAt-=over;if(over>2000){R.cheered=true;R.tipped=true}
  }
  paintRun();
}
// Background notification: when the user leaves mid-workout, show what's running and the clock time it ends.
// iOS freezes the page in the background, so the text uses an end time rather than a live countdown. Where the page
// keeps running (e.g. Android), it's refreshed at each interval change. Requires settings.notify and permission.
const NOTE_TAG='bubba-run';
const clockAt=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'});
function runNotify(){

function usesDB(name){const n=name||'';if(EQ[n])return EQ[n].split(/[ |]/).includes('db');if(/dumbbell|weighted|goblet/i.test(n))return true;
  const k=moveFor(n);return !!MOVES[k].db&&k!=='march'&&!/push.?up|plank|air|bodyweight|band|cable|trx|kettlebell|barbell/i.test(n)}
const kg=v=>typeof v==='number'?`${+v.toFixed(1)} kg`:'–';
// Most recent weight logged for this exercise in the same workout (by id, falling back to name).
function lastWeight(w,name){for(const h of history){if((w.id?h.wid===w.id:h.name===(w.name||'Quick timer'))&&h.weights&&typeof h.weights[name]==='number')return h.weights[name]}return null}
// The work interval a rest follows (the exercise just done).
function prevWork(R){for(let i=R.idx-1;i>=0;i--)if(R.seq[i].kind==='work')return R.seq[i];return null}
// Weight progress: every logged weight for an exercise, oldest first.
function weightSeries(name){return history.filter(h=>h.weights&&typeof h.weights[name]==='number').map(h=>({at:h.at,kg:h.weights[name],w:h.name})).reverse()}
function weightedNames(){const seen=new Map();for(const h of history)if(h.weights)for(const [n,v] of Object.entries(h.weights))if(typeof v==='number'&&!seen.has(n))seen.set(n,h.at);return [...seen.keys()]}
function progressChart(pts){
  if(pts.length<2)return `<div class="prog-stat"><div class="big num">${kg(pts[0].kg)}</div><p>Logged once so far. Log it in a few more sessions to see a trend.</p></div>`;
  const W=340,H=180,L=34,R=12,T=14,B=26,x0=pts[0].at,x1=pts[pts.length-1].at,lo=Math.min(...pts.map(p=>p.kg)),hi=Math.max(...pts.map(p=>p.kg));
  const step=Math.max(.5,Math.ceil((hi-lo||2)/3*2)/2),y0=Math.max(0,Math.floor(lo/step)*step-(lo===hi?step:0)),y1=Math.ceil(hi/step)*step+(lo===hi?step:0);
  const X=t=>L+(x1===x0?0.5:(t-x0)/(x1-x0))*(W-L-R),Y=v=>T+(1-(v-y0)/((y1-y0)||1))*(H-T-B);
  const ticks=[];for(let v=y0;v<=y1+1e-9;v+=step)ticks.push(+v.toFixed(1));
  const d=pts.map((p,i)=>`${i?'L':'M'}${X(p.at).toFixed(1)},${Y(p.kg).toFixed(1)}`).join('');
  const date=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'});
  return `<div class="prog-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time, ${pts.length} sessions">
    ${ticks.map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join('')}
    <text class="axis" x="${L}" y="${H-6}">${date(x0)}</text><text class="axis" x="${W-R}" y="${H-6}" text-anchor="end">${date(x1)}</text>
    <path class="line" d="${d}"/>
    ${pts.map((p,i)=>`<g class="pt" data-i="${i}"><circle class="hit" cx="${X(p.at)}" cy="${Y(p.kg)}" r="14"/><circle class="dot" cx="${X(p.at)}" cy="${Y(p.kg)}" r="4"/></g>`).join('')}
  </svg><div class="prog-tip" id="prog-tip" hidden></div></div>`;
}

// Confetti: two bursts from the bottom corners, with gravity, drag and spin, cleared after a few seconds.
function confetti(){const c=document.getElementById('confetti');if(!c||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const x=c.getContext('2d'),dpr=devicePixelRatio||1,W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.scale(dpr,dpr);
  const cols=['#F2B544','#1E7A5C','#6E9BEE','#9B6BE0','#F28CB1','#E26A58'];
  const burst=(ox,dir,n)=>Array.from({length:n},()=>{const a=(-Math.PI/2)+dir*(.1+Math.random()*.5),v=15+Math.random()*13;
    return {x:ox,y:H+10,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:6+Math.random()*6,h:3+Math.random()*4,r:Math.random()*6.3,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0],tw:Math.random()*6.3}});
  const P=[...burst(0,1,110),...burst(W,-1,110)];const t0=performance.now();let last=t0;
  // Physics scale with elapsed time (dt in 60fps frames), so the burst looks the same on slow or throttled frames.
  (function f(now){const el=now-t0,dt=Math.min(3,Math.max(0,(now-last)/16.67)),drag=Math.pow(.982,dt);last=now;x.clearRect(0,0,W,H);x.globalAlpha=Math.max(0,Math.min(1,(4500-el)/800));
    for(const p of P){p.vy+=.2*dt;p.vx*=drag;p.vy*=drag;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;p.tw+=.15*dt;
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.scale(1,Math.cos(p.tw));x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()}
    if(el<4500&&document.body.contains(c))requestAnimationFrame(f);else c.remove()})(t0);
}
function hearts(){const c=document.getElementById('hearts');if(!c||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const x=c.getContext('2d');const dpr=devicePixelRatio||1;c.width=innerWidth*dpr;c.height=innerHeight*dpr;x.scale(dpr,dpr);const cols=['#F28CB1','#F6C453','#1E7A5C','#6E9BEE','#E26A58'];const P=Array.from({length:60},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.6,vy:1.5+Math.random()*2.5,vx:(Math.random()-.5)*1.2,s:8+Math.random()*10,r:Math.random()*6.28,c:pick(cols),h:Math.random()<.5}));let t=0;function heart(px,py,s,r){x.save();x.translate(px,py);x.rotate(r);x.scale(s/16,s/16);x.beginPath();x.moveTo(0,5);x.bezierCurveTo(-8,-3,-8,-10,0,-6);x.bezierCurveTo(8,-10,8,-3,0,5);x.fill();x.restore()}function f(){x.clearRect(0,0,innerWidth,innerHeight);let alive=false;P.forEach(p=>{p.y+=p.vy;p.x+=p.vx+Math.sin((p.y+p.r)/30)*.6;p.r+=.03;if(p.y<innerHeight+30)alive=true;x.fillStyle=p.c;if(p.h)heart(p.x,p.y,p.s,p.r);else{x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()}});t++;if(alive&&t<600)requestAnimationFrame(f);else c.remove()}requestAnimationFrame(f)}

function render(){
  ({welcome:renderWelcome,home:renderHome,quick:renderQuick,builder:renderBuilder,run:renderRun,summary:renderSummary})[S.screen]();
  renderSheet();
}

// ---------- helpers ----------
function getPath(o,p){return p.split('.').reduce((a,k)=>a[k],o)}
function setPath(o,p,v){const ks=p.split('.');const last=ks.pop();const tgt=ks.length?getPath(o,ks.join('.')):o;tgt[last]=v}
function parseTime(s){s=String(s).trim();if(/^\d+:\d{1,2}$/.test(s)){const [m,x]=s.split(':').map(Number);return m*60+x}const n=parseInt(s,10);return isNaN(n)?null:n}
function savePreset(){const w=S.draft;if(!w.name.trim()){w.name=S.draftMode==='quick'?`Quick ${w.exercises[0].dur}/${w.exercises[0].restBetweenSets} × ${w.exercises[0].sets}`:'Untitled workout'}
  w.lastUsed=Date.now();const i=presets.findIndex(p=>p.id===w.id);if(i>=0)presets[i]=JSON.parse(JSON.stringify(w));else presets.push(JSON.parse(JSON.stringify(w)));store.set('cadence.presets',presets);S.editingId=w.id;toast('Saved');render()}

// ---------- events ----------
app.addEventListener('click',e=>{
  const eq=e.target.closest('[data-eq]');if(eq){const k=eq.dataset.eq,h=settings.equip;settings.equip=h.includes(k)?h.filter(x=>x!==k):h.concat(k);store.set('cadence.settings',settings);eq.setAttribute('aria-pressed',settings.equip.includes(k));const go=document.getElementById('welcome-go');if(go)go.textContent=settings.equip.length?'Continue':'Continue with bodyweight only';return}
  const st=e.target.closest('[data-stepper]');
  if(st&&(e.target.closest('[data-inc]')||e.target.closest('[data-dec]'))){
    const p=st.dataset.stepper,step=+st.dataset.step,min=+st.dataset.min;const cur=getPath(S.draft,p);
    const v=Math.max(min,cur+(e.target.closest('[data-inc]')?step:-step));setPath(S.draft,p,v);render();return}
  const ex=e.target.closest('[data-exact]');
  if(ex){const i=+ex.dataset.i,a=ex.dataset.exact,arr=S.draft.exercises;
    if(a==='del'&&arr.length>1)arr.splice(i,1);
    if(a==='dup')arr.splice(i+1,0,Object.assign({},arr[i],{id:uid()}));
    if(a==='up'&&i>0)[arr[i-1],arr[i]]=[arr[i],arr[i-1]];
    if(a==='down'&&i<arr.length-1)[arr[i+1],arr[i]]=[arr[i],arr[i+1]];
    render();return}
  const tpl=e.target.closest('[data-tpl]');
  if(tpl){const w=S.draft,x=w.exercises[0];const T={tabata:[8,20,10,8,1,0],emom:[8,45,15,10,1,0],'3030':[8,30,30,10,1,0],'4515':[8,45,15,6,3,60]}[tpl.dataset.tpl];[w.prep,x.dur,x.restBetweenSets,x.sets,w.rounds,w.restBetweenRounds]=T;render();return}
  const col=e.target.closest('[data-color]');if(col){S.draft.color=col.dataset.color;render();return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  switch(a){
    case 'home':S.screen='home';S.editingId=null;render();break;
    case 'settings':S.sheet=true;renderSheet();break;
    case 'quick':S.draftMode='quick';S.draft=newDraft('quick');S.editingId=null;S.screen='quick';render();break;
    case 'new':S.draftMode='builder';S.draft=newDraft('builder');S.editingId=null;S.screen='builder';render();break;
    case 'toBuilder':S.draftMode='builder';S.draft.name=S.draft.name==='Quick timer'?'':S.draft.name;S.screen='builder';render();break;
    case 'open':openPreset(b.dataset.id);break;
    case 'allWorkouts':S.allW=true;renderAllWorkouts();break;
    case 'allHistory':S.allH=true;renderAllHistory();break;
    case 'welcomeName':{const v=(document.getElementById('welcome-name').value||'').trim();settings.nick=v||'Bubba';store.set('cadence.settings',settings);S.welcomeStep='equip';render();break}
    case 'welcomeBack':S.welcomeStep='name';render();break;
    case 'finishWelcome':store.set('cadence.onboarded',true);store.set('cadence.settings',settings);S.screen='home';render();break;
    case 'openLib':S.lib={part:'All',q:''};renderLib();break;
    case 'addEx':S.draft.exercises.push({id:uid(),name:'',dur:40,sets:1,reps:'',restBetweenSets:15});render();setTimeout(()=>{const inp=app.querySelector(`.ex:last-of-type input[data-text]`);inp&&inp.focus()},0);break;
    case 'savePreset':savePreset();break;
    case 'deletePreset':presets=presets.filter(p=>p.id!==S.editingId);store.set('cadence.presets',presets);S.screen='home';S.editingId=null;toast('Deleted');render();break;
    case 'start':startRun(JSON.parse(JSON.stringify(S.draft)));break;
    case 'pause':if(S.run)S.run.autoPaused=false;togglePause();break;
    case 'addRest':addRest();break;
    case 'wtInc':case 'wtDec':{const R=S.run,ex=document.getElementById('wt').dataset.ex;if(!R||!ex)break;const cur=typeof R.weights[ex]==='number'?R.weights[ex]:0;R.weights[ex]=Math.max(0,cur+(a==='wtInc'?1:-1));document.getElementById('wt-in').value=+R.weights[ex].toFixed(1);break}
    case 'progress':S.prog={ex:null};renderProgress();break;
    case 'restartEx':restartEx();break;
    case 'skip':skip(1);break;
    // Previous restarts the current interval if more than 3s in (or on the first one), otherwise goes back one.
    case 'prev':{const R=S.run;if(!R)break;const it=R.seq[R.idx],into=it.dur*1000-(R.paused?R.remain:R.endAt-Date.now());skip(into>3000||R.idx===0?0:-1);break}
    // Two taps to end: the first arms the button for 3s, a second tap within that window ends the workout.
    case 'end':if(b.dataset.armed){clearTimeout(S.endArm);S.endArm=null;finishRun(false)}else{b.dataset.armed='1';b.textContent='Tap again to end';vib(40);S.endArm=setTimeout(()=>{delete b.dataset.armed;b.textContent='End workout';S.endArm=null},3000)}break;
    case 'again':startRun(S.draft);break;
    case 'clearhist':history=[];store.set('cadence.history',history);render();break;
  }
});
const isExName=el=>el&&el.matches&&el.matches('.ex-head input[data-text]');
app.addEventListener('focusin',e=>{if(isExName(e.target))showSuggest(e.target)});
// Typing a weight during a rest pauses the timer; dismissing the keyboard (blur) resumes it, unless the user paused it themselves.
app.addEventListener('focusin',e=>{const R=S.run;if(e.target.id==='wt-in'&&R&&!R.paused){togglePause();R.autoPaused=true}});
app.addEventListener('focusout',e=>{const R=S.run;if(e.target.id==='wt-in'&&R&&R.autoPaused){R.autoPaused=false;if(R.paused)togglePause()}});
app.addEventListener('focusout',e=>{if(isExName(e.target))setTimeout(()=>{if(!isExName(document.activeElement))closeSuggest()},250)});
app.addEventListener('input',e=>{const inp=e.target;
  if(inp.id==='wt-in'&&S.run){const ex=document.getElementById('wt').dataset.ex,v=parseFloat(inp.value.replace(',','.'));if(ex)S.run.weights[ex]=isNaN(v)?null:Math.max(0,v);return}
  if(inp.matches('[data-sumwt]')&&S.summary){const v=parseFloat(inp.value.replace(',','.'));S.summary.weights[inp.dataset.sumwt]=isNaN(v)?null:Math.max(0,v);store.set('cadence.history',history);return}
  if(!isExName(inp))return;showSuggest(inp);inp.closest('.ex-head').querySelector('.ex-fig').innerHTML=figSVG(inp.value)});
app.addEventListener('click',e=>{if(isExName(e.target)&&!e.target.closest('.ex-head').querySelector('.suggest')){showSuggest(e.target);return}const pk=e.target.closest('[data-pick]');if(!pk)return;
  const inp=pk.closest('.ex-head').querySelector('input');inp.value=pk.dataset.pick;setPath(S.draft,inp.dataset.text,inp.value);
  inp.closest('.ex-head').querySelector('.ex-fig').innerHTML=figSVG(inp.value);closeSuggest();inp.blur();
  const tl=app.querySelector('.timeline');if(tl)tl.outerHTML=timelineHTML(S.draft)});
app.addEventListener('change',e=>{
  const inp=e.target;
  if(inp.matches('[data-text]')){setPath(S.draft,inp.dataset.text,inp.value);const tl=app.querySelector('.timeline');if(tl)tl.outerHTML=timelineHTML(S.draft);return}
  const st=inp.closest('[data-stepper]');
  if(st&&inp.matches('.val')){const v=parseTime(inp.value);if(v===null){render();return}setPath(S.draft,st.dataset.stepper,Math.max(+st.dataset.min,v));render()}
});
app.addEventListener('keydown',e=>{if(e.key==='Escape')closeSuggest();if(e.key==='Enter'&&e.target.id==='welcome-name'){e.preventDefault();app.querySelector('[data-act="welcomeName"]').click();return}if(e.key==='Enter'&&e.target.matches('input'))e.target.blur()});
layer.addEventListener('change',e=>{if(e.target.matches('[data-nick]')){settings.nick=e.target.value.trim()||'Bubba';store.set('cadence.settings',settings);return}if(e.target.matches('[data-voice]')){settings.voiceURI=e.target.value;store.set('cadence.settings',settings);say('Rest. Next up, air squats.',true)}});
layer.addEventListener('change',e=>{if(e.target.matches('[data-progex]')&&S.prog){S.prog.ex=e.target.value;renderProgress()}});
layer.addEventListener('input',e=>{if(e.target.matches('[data-libq]')&&S.lib){S.lib.q=e.target.value;document.getElementById('lib-list').innerHTML=libListHTML()}});
layer.addEventListener('click',e=>{
  if(S.prog){const pt=e.target.closest('.pt');if(pt){const p=S.progPts[+pt.dataset.i],tip=document.getElementById('prog-tip'),c=pt.querySelector('.dot'),box=pt.closest('svg').getBoundingClientRect(),vb=pt.closest('svg').viewBox.baseVal;
      tip.hidden=false;tip.innerHTML=`<b class="num">${kg(p.kg)}</b><span>${new Date(p.at).toLocaleDateString(undefined,{month:'short',day:'numeric'})} · ${esc(p.w)}</span>`;
      // Keep the tooltip inside the chart: clamp horizontally, and show it below points near the top.
      const px=(c.cx.baseVal.value/vb.width)*box.width,py=(c.cy.baseVal.value/vb.height)*box.height,half=tip.offsetWidth/2+4;
      tip.style.left=`${Math.min(box.width-half,Math.max(half,px))}px`;tip.style.top=`${py}px`;tip.classList.toggle('below',py<box.height*.4);return}
    if(e.target.closest('.lib-head [data-act="closeProg"]')||e.target.matches('.sheet[data-act="closeProg"]')){S.prog=null;renderProgress()}return}
  if(S.allH){if(e.target.closest('.lib-head [data-act="closeHist"]')||e.target.matches('.sheet[data-act="closeHist"]')){S.allH=false;renderAllHistory()}return}
  if(S.allW){const o=e.target.closest('[data-act="open"]');if(o){S.allW=false;layer.innerHTML='';openPreset(o.dataset.id);return}
    if(e.target.closest('.lib-head [data-act="closeAll"]')||e.target.matches('.sheet[data-act="closeAll"]')){S.allW=false;renderAllWorkouts()}
    return}
  const eq=e.target.closest('[data-eq]');if(eq){const k=eq.dataset.eq,h=settings.equip;settings.equip=h.includes(k)?h.filter(x=>x!==k):h.concat(k);store.set('cadence.settings',settings);eq.setAttribute('aria-pressed',settings.equip.includes(k));return}
  if(S.lib){const lp=e.target.closest('[data-libpart]'),la=e.target.closest('[data-libadd]');
    if(lp){S.lib.part=lp.dataset.libpart;layer.querySelectorAll('[data-libpart]').forEach(b=>b.setAttribute('aria-pressed',b===lp));document.getElementById('lib-list').innerHTML=libListHTML();return}
    if(la){addFromLib(la.dataset.libadd);return}
    if(e.target.closest('.lib-head [data-act="closeLib"]')||e.target.matches('.sheet[data-act="closeLib"]')){S.lib=null;renderLib()}
    return}
  const sw=e.target.closest('[data-set]');if(sw){settings[sw.dataset.set]=!settings[sw.dataset.set];store.set('cadence.settings',settings);if(sw.dataset.set==='loud')setSession();
    if(sw.dataset.set==='notify'&&settings.notify){if(!('Notification' in window)){settings.notify=false;store.set('cadence.settings',settings);toast('Add the app to your Home Screen to allow notifications')}
      else Notification.requestPermission().then(r=>{if(r!=='granted'){settings.notify=false;store.set('cadence.settings',settings);toast('Notifications are blocked in your settings');renderSheet()}}).catch(()=>{})}
    renderSheet();return}
  if(e.target.closest('[data-act="testBeep"]')){ac();loadBeep();setTimeout(()=>{beepAt(3,0);beepAt(2,1);beepAt(1,2)},300);return}
  if(e.target.closest('[data-act="previewVoice"]')){say(`Push-ups. Twelve reps. Set two of three. Go ${settings.nick}, go.`,true);return}
  if(e.target.closest('[data-act="closeSheet"]')&&!e.target.closest('[data-stop]')||e.target.closest('.panel [data-act="closeSheet"]')){S.sheet=false;renderSheet()}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){clearNotify();if(S.run){if(!S.run.paused)lockScreen();tick();paintRun(true)}}else if(S.run)runNotify()});
document.addEventListener('keydown',e=>{if(S.screen!=='run')return;if(e.code==='Space'){e.preventDefault();togglePause()}if(e.key==='ArrowRight')skip(1);if(e.key==='ArrowLeft')skip(-1)});

render();
})();
</script>

<script>
// When a new service worker has installed over an existing one, offer a reload so the update takes effect.
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").then(reg=>{
  const offer=()=>{if(!navigator.serviceWorker.controller||document.querySelector(".toast.update"))return;const t=document.createElement("div");t.className="toast update";t.textContent="New version ready · Tap to update";t.addEventListener("click",()=>location.reload());document.body.appendChild(t)};
  if(reg.waiting)offer();
  reg.addEventListener("updatefound",()=>{const w=reg.installing;if(w)w.addEventListener("statechange",()=>{if(w.state==="installed")offer()})});
}).catch(()=>{})}
</script>
